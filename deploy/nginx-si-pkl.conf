# ---------------------------------------------------------------------------
# SI-PKL — Nginx reverse proxy HTTPS
#
# Pasang sebagai /etc/nginx/sites-available/si-pkl lalu symlink ke
# /etc/nginx/sites-enabled/. Sesuaikan domain dan path sertifikat.
#
#   sudo ln -s /etc/nginx/sites-available/si-pkl /etc/nginx/sites-enabled/si-pkl
#   sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream si_pkl_app {
    server 127.0.0.1:9003;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name si-pkl.akucintacysec.online;

    # Biarkan Certbot/Let's Encrypt melakukan validasi HTTP-01.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name si-pkl.akucintacysec.online;

    ssl_certificate     /etc/letsencrypt/live/si-pkl.akucintacysec.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/si-pkl.akucintacysec.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # Upload dokumentasi/laporan dibatasi 2 MB di aplikasi; beri ruang untuk
    # overhead multipart dan Server Action.
    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/si-pkl.access.log;
    error_log  /var/log/nginx/si-pkl.error.log warn;

    location / {
        proxy_pass http://si_pkl_app;

        # Header ini penting agar Next.js tahu skema asli HTTPS dan cookie
        # secure tidak menyebabkan redirect loop.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;
    }
}
